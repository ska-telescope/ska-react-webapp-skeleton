image: $SKA_K8S_TOOLS_BUILD_DEPLOY

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  NODE_IMAGE: 'node:22'
  CYPRESS_IMAGE: 'cypress/browsers:22.12.0'

stages:
  - dependencies
  - lint
  - build
  - test
  - scan
  - pages
  - accessibility
  - publish

js-test:
  allow_failure: true
  image: ${CYPRESS_IMAGE}
  before_script:
    - apt update && apt install -y make ## needed because base image does not have these packages
    - '[ -f .make/js.mk ] || (echo "File js.mk not included in Makefile"; exit 1;)'
    - 'make help | grep js-test'
    - make js-install-reinstall

ts-typecheck:
  image: $NODE_IMAGE
  stage: lint
  needs: []
  allow_failure: true
  before_script:
    - make js-install
  script:
    - make typecheck

include:
  # TS linting and unit testing
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/js.gitlab-ci.yml'
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # Tag Based GitLab Release Management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'
  # Accessibility
  - template: 'Verify/Accessibility.gitlab-ci.yml'
  # .post step finalizers eg: badges
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/finaliser.gitlab-ci.yml'
