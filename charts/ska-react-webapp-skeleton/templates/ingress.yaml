{{- $prefix := "" }}
{{- if .Values.ingress.prefixWithNamespace }}
{{- $prefix = printf "/%s" .Release.Namespace }}
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "ska-react-webapp-skeleton.fullname" . }}
  namespace: {{ template "ska-react-webapp-skeleton.namespace" . }}
  labels:
    {{- include "ska-react-webapp-skeleton.labels" . | nindent 4 }}
  annotations:
    {{- include "ska-react-webapp-skeleton.ingress.annotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ $prefix }}{{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ template "ska-react-webapp-skeleton.fullname" $ }}
                port:
                  name: http
{{- end }}
