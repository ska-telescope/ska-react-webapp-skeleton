apiVersion: v1
kind: Service
metadata:
  name: {{ template "ska-react-webapp-skeleton.fullname" . }}
  namespace: {{ template "ska-react-webapp-skeleton.namespace" . }}
  labels:
    {{- include "ska-react-webapp-skeleton.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{ tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.service.type "NodePort") (not (empty .Values.service.nodePort)) }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector:
    {{- include "ska-react-webapp-skeleton.matchLabels" . | nindent 4 }}
